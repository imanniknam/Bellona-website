# Render Blueprint: one free Node web service for the Next.js site.
# Dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for at creation.
services:
  - type: web
    name: bellona-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # `next start` listens on Render's PORT automatically.
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://bellonaagency.com
      - key: BOOKING_URL
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: LEAD_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LEAD_FROM_EMAIL
        sync: false
      - key: LEAD_TO_EMAIL
        value: bellona.ai.team@gmail.com
      - key: NEXT_PUBLIC_ANALYTICS_ID
        sync: false
