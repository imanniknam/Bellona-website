<!--
  Animated hero mark (cube stack on circuit plinth). Use INLINE in the page (not <img>),
  together with motion.css. Class names are what motion.css animates.

  Intro plays on mount (3.7 s). Afterwards the shuffle scheduler (see MOTION.md) adds
  `settled` to .bm-top/.bm-bottom/.bm-wedge/.bm-ghost and toggles one `mv-<move>` class at a time.

  Layering note: .bm-ghost is an identical copy of the bottom cube drawn ABOVE the top cube.
  During swap/leap moves motion.css cross-fades bottom -> ghost at the instant the two cubes
  do not overlap, so the cube that ends on top is always painted on top.
-->
<svg viewBox="0 -40 200 256" width="480" height="616" role="img" aria-label="Bellona logo" style="overflow: visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g class="bm-slab">
    <polygon points="100,113.3 175.7,157 100,200.7 24.3,157" fill="#F97316" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="24.3,168 100,211.7 100,200.7 24.3,157" fill="#FF5500" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="175.7,168 100,211.7 100,200.7 175.7,157" fill="#0D0D0D" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="38.3,155.8 72.1,175.4 74.9,183" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <polyline points="161.7,155.8 125.9,176.6 123.1,184.1" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  </g>
  <polyline class="bm-trace" points="38.3,155.8 72.1,175.4 74.9,183" fill="none" stroke="#0D0D0D" stroke-width="2"/>
  <polyline class="bm-trace" points="161.7,155.8 125.9,176.6 123.1,184.1" fill="none" stroke="#0D0D0D" stroke-width="2"/>
  <circle class="bm-via" cx="76.5" cy="186.7" r="2.6" fill="none" stroke="#0D0D0D" stroke-width="1.8"/>
  <circle class="bm-via" cx="121.5" cy="187.8" r="2.6" fill="none" stroke="#0D0D0D" stroke-width="1.8"/>
  <g class="bm-bottom">
    <polygon points="60.2,111 100,88 139.8,111 100,134" fill="#F97316" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="60.2,111 100,134 100,180 60.2,157" fill="#FF5500" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="100,134 139.8,111 139.8,157 100,180" fill="#0D0D0D" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="bm-top">
    <polygon points="60.2,43 100,20 139.8,43 100,66" fill="#F97316" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="60.2,43 100,66 100,112 60.2,89" fill="#FF5500" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="100,66 139.8,43 139.8,89 100,112" fill="#0D0D0D" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="bm-ghost" aria-hidden="true">
    <polygon points="60.2,111 100,88 139.8,111 100,134" fill="#F97316" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="60.2,111 100,134 100,180 60.2,157" fill="#FF5500" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="100,134 139.8,111 139.8,157 100,180" fill="#0D0D0D" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="bm-wedge">
    <polygon points="60.2,89 79.2,100 60.2,111" fill="#FF5500" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
